; =============================================================================
;  sega_alls.ini -- bundled DEFAULT controls profile for Sega ALLS UX (gun cab).
; =============================================================================
;  Gun-cab default (Haunted Museum / Time Crisis class): the Ultra Omni-Track
;  lightgun drives the screen position + trigger; the mouse is a fallback aim. The
;  gun X/Y render to the JVS screen-position (jvs_ch = screen). Copy to
;  <game_dir>/ultra_controls.ini and edit to remap. Activate via ULTRA_CONTROLS=1.
; =============================================================================
[meta]
system_id = sega_alls
genre = gun
analog_channels = 8
screenpos = 1

[buttons]
p1.trigger = gun:trigger, mouse:left         ; Omni-Track trigger / left mouse
p1.reload  = gun:reload,  mouse:right        ; off-screen reload / right mouse
p1.start   = key:0x31                         ; '1'
p1.coin    = key:0x35                         ; '5'
sys.test   = key:0x71                         ; F2

[axes]
; intent  = source:code  jvs_ch  out_min out_max
p1.gun_x  = gun:x   screen 0 65535
p1.gun_y  = gun:y   screen 0 65535
; mouse fallback over the device window
p1.gun_x  = mouse:x screen 0 65535
p1.gun_y  = mouse:y screen 0 65535
