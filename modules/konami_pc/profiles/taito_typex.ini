; =============================================================================
;  taito_typex.ini -- bundled DEFAULT controls profile for Taito Type X (fight).
; =============================================================================
;  Fighter-cab default (Chaos Breaker class): keyboard arrows + ZXCV, XInput pad.
;  Copy to <game_dir>/ultra_controls.ini and edit to remap. Partial files inherit
;  the compiled default. Activate via ULTRA_CONTROLS=1 or by placing a config file.
; =============================================================================
[meta]
system_id = taito_typex
genre = fight
analog_channels = 8

[buttons]
p1.up      = key:0x26, xinput:up             ; arrows
p1.down    = key:0x28, xinput:down
p1.left    = key:0x25, xinput:left
p1.right   = key:0x27, xinput:right
p1.push1   = key:0x5A, xinput:a              ; Z / A
p1.push2   = key:0x58, xinput:b              ; X / B
p1.push3   = key:0x43, xinput:x              ; C / X
p1.push4   = key:0x56, xinput:y              ; V / Y
p1.start   = key:0x31, xinput:start          ; '1' / START
p1.service = key:0x39                         ; '9'
sys.test   = key:0x71, xinput:back           ; F2 / BACK
p1.coin    = key:0x35, xinput:l3             ; '5' / L3

[axes]
; analog stick exposed as STICK_X/Y for games that read analog directions.
p1.stick_x = xinput:lx  0  0 65535  0 18 lin
p1.stick_y = xinput:ly  1  0 65535  1 18 lin
