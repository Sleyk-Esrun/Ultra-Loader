; =============================================================================
;  taito_typex2.ini -- bundled DEFAULT controls profile for Taito Type X2 (racer).
; =============================================================================
;  This is the racer-cab default (Wacky Race class): wheel + pedals on a physical
;  DirectInput device, with XInput stick/trigger + keyboard fallbacks. Copy this to
;  <game_dir>/ultra_controls.ini and edit to remap. A partial file is valid -- any
;  binding you omit keeps the compiled default.
;
;  Activate the input-map layer with ULTRA_CONTROLS=1 (or just by placing a config
;  file). The out_min/out_max numbers on each axis are the NVRAM calibration window
;  the game expects (WR0.CFG): feeding 1.0 lands at out_max, never an out-of-range
;  raw. Source tokens: key:<vk> xinput:<btn|axis> dinput:<btn|axis> mouse:<btn|axis>
;  gun:<trigger|reload|x|y>. Intents: p<N>.<button|axis>, sys.<test|tilt>, p<N>.coin.
; =============================================================================
[meta]
system_id = taito_typex2
genre = racer
analog_channels = 10
screenpos = 0

[buttons]
p1.start   = key:0x31, xinput:start          ; '1' or pad START
p1.push1   = key:0x20, xinput:a              ; SPACE / A = VIEW
p1.service = key:0x39                         ; '9'
sys.test   = key:0x71                         ; F2
p1.coin    = key:0x35, xinput:l3             ; '5' / L3
p1.push2   = dinput:btn4                      ; wheel paddle up
p1.push3   = dinput:btn5                      ; wheel paddle down

[axes]
; intent  = source:code  jvs_ch  out_min out_max  [invert] [deadzone%] [curve]
p1.steer  = dinput:axisX   0   4000 64000   0  6  lin
p1.accel  = dinput:axisY   1  26000 44000   0  0  expo
p1.brake  = dinput:axisRz  2  28000 47000   0  0  lin
; XInput fallback when no wheel is attached
p1.steer  = xinput:lx      0   4000 64000   0 12  lin
p1.accel  = xinput:rt      1  26000 44000   0  0  lin
p1.brake  = xinput:lt      2  28000 47000   0  0  lin
